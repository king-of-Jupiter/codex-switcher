name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build portable exe (PyInstaller)
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --clean --noconfirm --onefile --windowed --name CodexSwitcher --icon assets/icon.ico --add-data "assets/icon-512.png;assets" main.py

      - name: Build setup exe (Inno Setup)
        shell: pwsh
        env:
          RAW_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('0.0.0-dev.{0}', github.run_number) }}
        run: |
          $ver = $env:RAW_VERSION.TrimStart('v')
          Write-Host "Installer version: $ver"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" "packaging/windows.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          if-no-files-found: error

  build-macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: intel
          - runner: macos-latest
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build app bundle (PyInstaller)
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --clean --noconfirm --windowed --name CodexSwitcher --icon assets/icon.icns --add-data "assets/icon-512.png:assets" main.py

      - name: Ad-hoc codesign and pack DMG
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0-dev.$GITHUB_RUN_NUMBER"; fi
          echo "DMG version: $VERSION"
          codesign --force --deep --sign - dist/CodexSwitcher.app
          mkdir -p release
          hdiutil create -volname "Codex Switcher" -srcfolder dist/CodexSwitcher.app \
            -ov -format UDZO "release/CodexSwitcher-${VERSION}-macos-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-dmg
          path: release/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
